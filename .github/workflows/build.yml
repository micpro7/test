name: Build Homebridge UXC ARM64 Bundle

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3


      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build Docker image
        run: |
          set -eux

          docker buildx build \
            --platform linux/arm64 \
            --build-arg HOMEBRIDGE_VERSION=latest \
            --build-arg CONFIG_UI_VERSION=latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag homebridge-build:local \
            --load \
            .


      - name: Export root filesystem
        run: |
          set -eux

          rm -rf output
          mkdir -p output/rootfs

          ID=$(docker create homebridge-build:local)

          docker export "$ID" | tar -x -C output/rootfs

          docker rm "$ID"


      - name: Create UXC config
        run: |
          set -eux

          cp config.json output/config.json


      - name: Build bundle archive
        run: |
          set -eux

          tar -czpf homebridge-arm64.tar.gz \
            -C output \
            config.json \
            rootfs


      - name: Validate bundle
        run: |
          set -eux

          test -f homebridge-arm64.tar.gz
          test -f output/config.json
          test -d output/rootfs

          jq empty output/config.json


      - name: Extract metadata
        run: |
          set -eux

          DATE=$(date +"%Y-%m-%d")

          HB_VERSION=$(node -p \
          "require('./output/rootfs/usr/local/lib/node_modules/homebridge/package.json').version")

          NODE_VERSION=$(node --version | tr -d 'v')

          SIZE=$(du -sh homebridge-arm64.tar.gz | cut -f1)


          echo "HB_VERSION=$HB_VERSION" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Homebridge v${HB_VERSION}-${DATE}" >> "$GITHUB_ENV"



      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-arm64
          path: homebridge-arm64.tar.gz



      - name: Create Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: homebridge-${{ env.HB_VERSION }}

          name: ${{ env.RELEASE_NAME }}

          body: |
            Homebridge UXC ARM64 Bundle

            Homebridge:
            ${{ env.HB_VERSION }}

            Node:
            ${{ env.NODE_VERSION }}

            Size:
            ${{ env.SIZE }}

          files: homebridge-arm64.tar.gz
