name: Build Homebridge UXC Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        description: "Homebridge version"
        required: false
        default: "latest"

      config_ui_version:
        description: "Config UI version"
        required: false
        default: "latest"

  schedule:
    - cron: "0 6 * * 1"

  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "init"
      - "config.json"
      - ".github/workflows/build.yml"


permissions:
  contents: write


concurrency:
  group: build-release
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-24.04-arm


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5



      # ==========================================================
      # BUILDX
      # ==========================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4



      # ==========================================================
      # BUILD HOMEbridge IMAGE
      # ==========================================================

      - name: Build Homebridge filesystem
        run: |

          set -eux


          docker buildx build \
            --build-arg HOMEBRIDGE_VERSION="${{ inputs.homebridge_version || 'latest' }}" \
            --build-arg CONFIG_UI_VERSION="${{ inputs.config_ui_version || 'latest' }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag homebridge-build:local \
            --load \
            .



      # ==========================================================
      # EXPORT ROOTFS
      # ==========================================================

      - name: Export container rootfs
        run: |

          set -eux


          CID=$(docker create homebridge-build:local)


          mkdir -p bundle/rootfs


          docker export "$CID" -o rootfs.tar


          docker rm "$CID"


          sudo tar -xpf rootfs.tar -C bundle/rootfs


          rm -f rootfs.tar



      # ==========================================================
      # CLEAN ROOTFS
      # ==========================================================

      - name: Minimize root filesystem
        run: |

          set -eux


          sudo rm -rf \
            bundle/rootfs/usr/share/man \
            bundle/rootfs/usr/share/doc \
            bundle/rootfs/var/cache/apk/* \
            bundle/rootfs/tmp/*



      # ==========================================================
      # CREATE UXC OCI BUNDLE
      # ==========================================================

      - name: Assemble UXC bundle
        run: |

          set -eux


          cp config.json bundle/config.json


          python3 -m json.tool \
            bundle/config.json \
            > /dev/null



          sudo test -x \
            bundle/rootfs/usr/local/bin/node



          cd bundle


          sudo tar \
            -czf ../homebridge-arm64.tar.gz \
            config.json \
            rootfs


          cd ..


          sudo chown \
            "$(id -u):$(id -g)" \
            homebridge-arm64.tar.gz



      # ==========================================================
      # VERIFY PACKAGE
      # ==========================================================

      - name: Validate bundle
        run: |

          set -eux


          tar -tzf homebridge-arm64.tar.gz | grep config.json


          tar -tzf homebridge-arm64.tar.gz | grep \
            "rootfs/usr/local/bin/node"


          echo "Bundle size:"
          du -sh homebridge-arm64.tar.gz



      # ==========================================================
      # EXTRACT BUILD INFORMATION
      # ==========================================================

      - name: Collect build information
        run: |

          set -eux


          DATE=$(date +"%Y-%m-%d")



          HB_VERSION=$(docker run \
            --rm \
            homebridge-build:local \
            sh -c \
            "node -p \"require('/usr/local/lib/node_modules/homebridge/package.json').version\"" \
          )



          NODE_VERSION=$(docker run \
            --rm \
            --entrypoint node \
            homebridge-build:local \
            --version | tr -d 'v')



          NPM_VERSION=$(docker run \
            --rm \
            --entrypoint npm \
            homebridge-build:local \
            --version)



          SIZE=$(du -sh homebridge-arm64.tar.gz | cut -f1)



          echo "HB_VERSION=$HB_VERSION" >> $GITHUB_ENV

          echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_ENV

          echo "NPM_VERSION=$NPM_VERSION" >> $GITHUB_ENV

          echo "SIZE=$SIZE" >> $GITHUB_ENV

          echo "RELEASE_NAME=Homebridge v${HB_VERSION}-${DATE}" >> $GITHUB_ENV




      # ==========================================================
      # RELEASE
      # ==========================================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: latest

          name: ${{ env.RELEASE_NAME }}

          make_latest: true


          files:
            homebridge-arm64.tar.gz


          body: |

            ## Homebridge UXC ARM64 Bundle


            ### Build Information

            - Homebridge: `${{ env.HB_VERSION }}`
            - Node.js: `${{ env.NODE_VERSION }}`
            - NPM: `${{ env.NPM_VERSION }}`
            - Size: `${{ env.SIZE }}`
            - Architecture: ARM64


            ### Environment

            - Alpine Linux 3.22
            - Node.js 24
            - Root execution UID 0
            - Designed for OpenWrt UXC containers


            ### Runtime

            - Persistent data should be mounted externally
            - Homebridge UI included
            - Native ARM64 build
            - Optimised for low RAM routers
