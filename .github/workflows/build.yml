name: Build Homebridge UXC ARM64 Bundle

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      # ==========================================================
      # Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # ARM64 emulation
      # ==========================================================
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3


      # ==========================================================
      # Docker Buildx
      # ==========================================================
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================================
      # Build Homebridge ARM64 image
      # ==========================================================
      - name: Build Homebridge image
        run: |
          set -eux

          docker buildx build \
            --platform linux/arm64 \
            --build-arg HOMEBRIDGE_VERSION=latest \
            --build-arg CONFIG_UI_VERSION=latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag homebridge-build:local \
            --load \
            .


      # ==========================================================
      # Extract versions
      # ==========================================================
      - name: Extract build information
        run: |
          set -eux

          DATE=$(date +"%Y-%m-%d")


          HB_VERSION=$(docker run \
            --rm \
            homebridge-build:local \
            node -p "require('/usr/local/lib/node_modules/homebridge/package.json').version"
          )


          NODE_VERSION=$(docker run \
            --rm \
            --entrypoint node \
            homebridge-build:local \
            --version | tr -d 'v'
          )


          NPM_VERSION=$(docker run \
            --rm \
            --entrypoint npm \
            homebridge-build:local \
            --version
          )


          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "HB_VERSION=$HB_VERSION" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$NPM_VERSION" >> "$GITHUB_ENV"


      # ==========================================================
      # Create UXC bundle
      # ==========================================================
      - name: Create UXC bundle
        run: |
          set -eux


          mkdir -p bundle/rootfs


          CONTAINER_ID=$(docker create \
            --platform linux/arm64 \
            homebridge-build:local
          )


          docker export \
            "$CONTAINER_ID" \
            -o rootfs.tar


          docker rm "$CONTAINER_ID"


          tar -xf rootfs.tar \
            -C bundle/rootfs


          cat > bundle/config.json <<'EOF'
{
  "ociVersion": "1.0.2",

  "process": {
    "terminal": false,

    "args": [
      "/sbin/tini",
      "--",
      "homebridge",
      "-U",
      "/var/lib/homebridge"
    ],

    "env": [
      "PATH=/usr/local/bin:/usr/bin:/bin",
      "TZ=Europe/London",
      "NODE_OPTIONS=--max-old-space-size=256"
    ],

    "cwd": "/var/lib/homebridge"
  },


  "root": {
    "path": "rootfs",
    "readonly": false
  },


  "mounts": [
    {
      "destination": "/var/lib/homebridge",

      "type": "bind",

      "source": "/mnt/X6/UXC/homebridge/data",

      "options": [
        "rbind",
        "rw"
      ]
    }
  ]
}
EOF


          jq empty bundle/config.json


      # ==========================================================
      # Package release archive
      # ==========================================================
      - name: Package Homebridge bundle
        run: |
          set -eux


          tar \
            -czpf \
            homebridge-arm64.tar.gz \
            bundle


          ls -lh homebridge-arm64.tar.gz


      # ==========================================================
      # Create GitHub release
      # ==========================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "homebridge-${{ env.HB_VERSION }}-${{ env.DATE }}"

          name: "Homebridge v${{ env.HB_VERSION }}-${{ env.DATE }}"


          body: |
            # Homebridge UXC ARM64 Bundle

            Homebridge:
            ${{ env.HB_VERSION }}

            Node.js:
            ${{ env.NODE_VERSION }}

            npm:
            ${{ env.NPM_VERSION }}

            Build date:
            ${{ env.DATE }}


          files: |
            homebridge-arm64.tar.gz
