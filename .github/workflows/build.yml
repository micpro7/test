name: Build Homebridge UXC ARM64 Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        description: "Homebridge version"
        required: false
        default: "latest"

      config_ui_version:
        description: "Homebridge Config UI X version"
        required: false
        default: "latest"

  schedule:
    - cron: "0 3 * * 0"


permissions:
  contents: write


jobs:

  build:

    name: Build Homebridge UXC Bundle
    runs-on: ubuntu-24.04


    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # ARM64 Support
      # ==========================================================

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3



      # ==========================================================
      # Build Homebridge image
      # ==========================================================

      - name: Build Homebridge ARM64 image
        timeout-minutes: 30
        run: |

          docker buildx build \
            --platform linux/arm64 \
            --load \
            --build-arg HOMEBRIDGE_VERSION=${{ github.event.inputs.homebridge_version || 'latest' }} \
            --build-arg CONFIG_UI_VERSION=${{ github.event.inputs.config_ui_version || 'latest' }} \
            -t homebridge-build:local \
            .



      # ==========================================================
      # Extract versions
      # ==========================================================

      - name: Extract build metadata
        timeout-minutes: 5
        shell: bash
        run: |

          set -eux


          DATE=$(date +"%Y-%m-%d")


          HB_VERSION=$(docker run \
            --rm \
            --entrypoint node \
            homebridge-build:local \
            -p "require('homebridge/package.json').version")


          NODE_VERSION=$(docker run \
            --rm \
            --entrypoint node \
            homebridge-build:local \
            --version | tr -d 'v')


          NPM_VERSION=$(docker run \
            --rm \
            --entrypoint npm \
            homebridge-build:local \
            --version)


          echo "HB_VERSION=$HB_VERSION" >> $GITHUB_ENV
          echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_ENV
          echo "NPM_VERSION=$NPM_VERSION" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV


          echo "RELEASE_NAME=Homebridge v${HB_VERSION}-${DATE}" >> $GITHUB_ENV



      # ==========================================================
      # Create UXC bundle
      # ==========================================================

      - name: Create UXC filesystem bundle
        timeout-minutes: 15
        run: |

          set -eux


          mkdir -p bundle/rootfs


          CONTAINER_ID=$(docker create homebridge-build:local)


          docker export \
            "$CONTAINER_ID" \
            -o rootfs.tar


          docker rm "$CONTAINER_ID"


          tar -xf rootfs.tar \
            -C bundle/rootfs


          rm rootfs.tar



      # ==========================================================
      # Generate UXC config.json
      # ==========================================================

      - name: Generate UXC config
        run: |

          cat > bundle/config.json <<'EOF'
{
  "ociVersion": "1.0.2",
  "process": {
    "terminal": false,
    "args": [
      "/sbin/tini",
      "--",
      "/init"
    ],
    "env": [
      "PATH=/usr/local/bin:/usr/bin:/bin",
      "TZ=Europe/London",
      "NODE_OPTIONS=--max-old-space-size=256",
      "UV_THREADPOOL_SIZE=4",
      "HOMEBRIDGE_CONFIG_UI=1"
    ],
    "cwd": "/var/lib/homebridge",
    "noNewPrivileges": false
  },

  "root": {
    "path": "rootfs"
  },

  "mounts": [
    {
      "destination": "/var/lib/homebridge",
      "type": "bind",
      "source": "/mnt/X6/UXC/homebridge/data",
      "options": [
        "rbind",
        "rw"
      ]
    }
  ],

  "linux": {
    "namespaces": [
      {
        "type": "pid"
      },
      {
        "type": "uts"
      },
      {
        "type": "ipc"
      },
      {
        "type": "mount"
      }
    ]
  }
}
EOF



      # ==========================================================
      # Validate bundle
      # ==========================================================

      - name: Validate bundle
        run: |

          set -eux


          test -d bundle/rootfs
          test -f bundle/config.json


          jq empty bundle/config.json


          echo "Bundle validation OK"



      # ==========================================================
      # Package
      # ==========================================================

      - name: Compress bundle
        run: |

          tar -czpf \
          homebridge-arm64.tar.gz \
          -C bundle .



      # ==========================================================
      # Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: |
            homebridge-${{ env.HB_VERSION }}-${{ env.DATE }}

          name: |
            ${{ env.RELEASE_NAME }}

          files: |
            homebridge-arm64.tar.gz

          generate_release_notes: true
