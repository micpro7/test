name: Build Home Assistant UXC ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  IMAGE_NAME: homeassistant-uxc
  PLATFORM: linux/arm64

jobs:
  build:
    name: Build ARM64 UXC bundle
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # QEMU / BUILDX
      # ============================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # BUILD ARM64 IMAGE
      #
      # Dockerfile deliberately contains:
      #
      # FROM python:3.14-slim-bookworm
      #
      # and:
      #
      # pip install homeassistant
      #
      # Therefore every build gets:
      # - latest Python 3.14.x available from the image
      # - latest Home Assistant available from PyPI
      # ============================================================

      - name: Build ARM64 Home Assistant image
        run: |
          set -eux

          docker buildx build \
            --platform "${PLATFORM}" \
            --tag "${IMAGE_NAME}:latest" \
            --load \
            .

      # ============================================================
      # VERIFY PYTHON
      # ============================================================

      - name: Verify Python version
        run: |
          set -eux

          docker run --rm \
            --platform "${PLATFORM}" \
            --entrypoint python3 \
            "${IMAGE_NAME}:latest" \
            --version

      # ============================================================
      # VERIFY HOME ASSISTANT
      # ============================================================

      - name: Verify Home Assistant version
        run: |
          set -eux

          docker run --rm \
            --platform "${PLATFORM}" \
            --entrypoint python3 \
            "${IMAGE_NAME}:latest" \
            -c "import homeassistant; print('Home Assistant:', homeassistant.const.__version__)"

      # ============================================================
      # SHOW INSTALLED VERSIONS
      # ============================================================

      - name: Show installed package versions
        run: |
          set -eux

          docker run --rm \
            --platform "${PLATFORM}" \
            --entrypoint python3 \
            "${IMAGE_NAME}:latest" \
            -m pip show homeassistant

      # ============================================================
      # CREATE TEMPORARY CONTAINER
      #
      # docker export is intentional.
      #
      # This converts the layered Docker image into the flat
      # filesystem required by the UXC rootfs layout.
      # ============================================================

      - name: Create container
        id: container
        run: |
          set -eux

          CID="$(docker create \
            --platform "${PLATFORM}" \
            "${IMAGE_NAME}:latest")"

          echo "container_id=${CID}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # EXTRACT FLAT ROOTFS
      # ============================================================

      - name: Create UXC rootfs
        run: |
          set -eux

          mkdir -p build/rootfs

          docker export \
            "${{ steps.container.outputs.container_id }}" \
            | tar -xpf - \
                -C build/rootfs

      # ============================================================
      # CLEAN CONTAINER
      # ============================================================

      - name: Remove temporary container
        if: always()
        run: |
          docker rm -f \
            "${{ steps.container.outputs.container_id }}" \
            2>/dev/null || true

      # ============================================================
      # GENERATE UXC CONFIG
      # ============================================================

      - name: Generate UXC config.json
        run: |
          set -eux

          mkdir -p build

          cp uxc/config.template.json \
             build/config.json

      # ============================================================
      # VERIFY UXC CONFIG
      # ============================================================

      - name: Validate UXC config
        run: |
          set -eux

          python3 -m json.tool \
            build/config.json \
            >/dev/null

      # ============================================================
      # VERIFY ROOTFS
      # ============================================================

      - name: Validate rootfs
        run: |
          set -eux

          test -f build/rootfs/entrypoint.sh

          test -x \
            build/rootfs/entrypoint.sh

          test -x \
            build/rootfs/usr/local/bin/python3

          test -d \
            build/rootfs/usr/local/lib/python3.14/site-packages/homeassistant

      # ============================================================
      # DETERMINE ACTUAL INSTALLED VERSIONS
      # ============================================================

      - name: Extract build versions
        id: versions
        run: |
          set -eux

          PYTHON_VERSION="$(
            docker run --rm \
              --platform "${PLATFORM}" \
              --entrypoint python3 \
              "${IMAGE_NAME}:latest" \
              -c 'import platform; print(platform.python_version())'
          )"

          HA_VERSION="$(
            docker run --rm \
              --platform "${PLATFORM}" \
              --entrypoint python3 \
              "${IMAGE_NAME}:latest" \
              -c 'import homeassistant; print(homeassistant.const.__version__)'
          )"

          echo "python=${PYTHON_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "homeassistant=${HA_VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Python: ${PYTHON_VERSION}"
          echo "Home Assistant: ${HA_VERSION}"

      # ============================================================
      # GENERATE README
      # ============================================================

      - name: Generate release README
        run: |
          set -eux

          cat > build/README.txt <<EOF
          Home Assistant Core UXC
          ========================

          Home Assistant:
          ${{ steps.versions.outputs.homeassistant }}

          Python:
          ${{ steps.versions.outputs.python }}

          Architecture:
          ARM64

          Platform:
          linux/arm64

          UXC memory limit:
          512 MiB

          UXC memory reservation:
          300 MiB

          UXC swap limit:
          512 MiB

          Home Assistant configuration:
          /config

          HTTP:
          8123

          This bundle is intended for UXC on OpenWrt.
          EOF

      # ============================================================
      # DISPLAY ROOTFS SIZE
      # ============================================================

      - name: Show rootfs size
        run: |
          set -eux

          echo "Total rootfs:"
          du -sh build/rootfs

          echo
          echo "Python:"
          du -sh \
            build/rootfs/usr/local/lib/python3.14

          echo
          echo "Home Assistant:"
          du -sh \
            build/rootfs/usr/local/lib/python3.14/site-packages/homeassistant

      # ============================================================
      # CREATE UXC BUNDLE
      # ============================================================

      - name: Create UXC bundle
        run: |
          set -eux

          mkdir -p release

          VERSION="${{ steps.versions.outputs.homeassistant }}"

          tar \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf \
            "release/homeassistant-uxc-arm64-${VERSION}.tar.gz" \
            -C build \
            rootfs \
            config.json \
            README.txt

      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256
        run: |
          set -eux

          cd release

          sha256sum \
            homeassistant-uxc-arm64-*.tar.gz \
            > SHA256SUMS

      # ============================================================
      # SHOW RELEASE FILES
      # ============================================================

      - name: Show release files
        run: |
          set -eux

          ls -lah release

          echo
          cat release/SHA256SUMS

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload UXC bundle
        uses: actions/upload-artifact@v4
        with:
          name: homeassistant-uxc-arm64-${{ steps.versions.outputs.homeassistant }}
          path: |
            release/homeassistant-uxc-arm64-*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error

      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/homeassistant-uxc-arm64-*.tar.gz
            release/SHA256SUMS