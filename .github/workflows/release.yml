name: Build Home Assistant UXC ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  IMAGE_NAME: homeassistant-uxc

jobs:
  build:
    name: Native ARM64 UXC Build
    runs-on: ubuntu-24.04-arm

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # VERIFY RUNNER ARCHITECTURE
      # ============================================================

      - name: Verify native ARM64 runner
        run: |
          set -eux

          echo "Runner architecture:"
          uname -m

          echo "Docker architecture:"
          docker version --format '{{.Server.Arch}}'

          test "$(uname -m)" = "aarch64"

      # ============================================================
      # SET UP BUILDX
      #
      # No QEMU.
      # No cross compilation.
      # Native ARM64 Docker build.
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # BUILD
      #
      # Because the runner itself is ARM64, this is a native build.
      # ============================================================

      - name: Build Home Assistant
        run: |
          set -eux

          docker buildx build \
            --platform linux/arm64 \
            --tag "${IMAGE_NAME}:latest" \
            --load \
            .

      # ============================================================
      # VERIFY PYTHON
      # ============================================================

      - name: Verify Python
        run: |
          set -eux

          docker run --rm \
            "${IMAGE_NAME}:latest" \
            python3 --version

      # ============================================================
      # VERIFY HOME ASSISTANT
      # ============================================================

      - name: Verify Home Assistant
        run: |
          set -eux

          docker run --rm \
            --entrypoint python3 \
            "${IMAGE_NAME}:latest" \
            -c 'import homeassistant; print("Home Assistant:", homeassistant.const.__version__)'

      # ============================================================
      # SHOW INSTALLED VERSIONS
      # ============================================================

      - name: Show installed versions
        run: |
          set -eux

          docker run --rm \
            --entrypoint python3 \
            "${IMAGE_NAME}:latest" \
            -c '
          import platform
          import homeassistant

          print("Architecture:", platform.machine())
          print("Python:", platform.python_version())
          print("Home Assistant:", homeassistant.const.__version__)
          '

      # ============================================================
      # CREATE CONTAINER
      # ============================================================

      - name: Create temporary container
        id: container
        run: |
          set -eux

          CID="$(docker create "${IMAGE_NAME}:latest")"

          echo "container_id=${CID}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # FLATTEN IMAGE TO UXC ROOTFS
      # ============================================================

      - name: Create UXC rootfs
        run: |
          set -eux

          mkdir -p build/rootfs

          docker export \
            "${{ steps.container.outputs.container_id }}" \
            | tar -xpf - \
                -C build/rootfs

      # ============================================================
      # CLEAN TEMPORARY CONTAINER
      # ============================================================

      - name: Remove temporary container
        if: always()
        run: |
          docker rm -f \
            "${{ steps.container.outputs.container_id }}" \
            2>/dev/null || true

      # ============================================================
      # INSTALL UXC CONFIG
      # ============================================================

      - name: Install UXC config
        run: |
          set -eux

          mkdir -p build

          cp uxc/config.template.json \
             build/config.json

      # ============================================================
      # VALIDATE UXC CONFIG
      # ============================================================

      - name: Validate UXC config
        run: |
          set -eux

          python3 -m json.tool \
            build/config.json \
            >/dev/null

      # ============================================================
      # VALIDATE ROOTFS
      # ============================================================

      - name: Validate rootfs
        run: |
          set -eux

          test -f build/rootfs/entrypoint.sh
          test -x build/rootfs/entrypoint.sh
          test -x build/rootfs/usr/local/bin/python3

          test -d \
            build/rootfs/usr/local/lib/python3.14/site-packages/homeassistant

      # ============================================================
      # DETERMINE INSTALLED VERSIONS
      # ============================================================

      - name: Determine versions
        id: versions
        run: |
          set -eux

          PYTHON_VERSION="$(
            docker run --rm \
              --entrypoint python3 \
              "${IMAGE_NAME}:latest" \
              -c 'import platform; print(platform.python_version())'
          )"

          HA_VERSION="$(
            docker run --rm \
              --entrypoint python3 \
              "${IMAGE_NAME}:latest" \
              -c 'import homeassistant; print(homeassistant.const.__version__)'
          )"

          echo "python=${PYTHON_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "homeassistant=${HA_VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Python: ${PYTHON_VERSION}"
          echo "Home Assistant: ${HA_VERSION}"

      # ============================================================
      # GENERATE README
      # ============================================================

      - name: Generate README
        run: |
          set -eux

          cat > build/README.txt <<EOF
Home Assistant Core UXC
=======================

Home Assistant:
${{ steps.versions.outputs.homeassistant }}

Python:
${{ steps.versions.outputs.python }}

Architecture:
ARM64

Platform:
linux/arm64

Build:
Native ARM64 GitHub Actions runner

Memory limit:
512 MiB

Memory reservation:
300 MiB

Swap limit:
512 MiB

Configuration:
 /config

HTTP:
8123

This bundle is intended for UXC on OpenWrt.
EOF

      # ============================================================
      # SHOW ROOTFS SIZE
      # ============================================================

      - name: Show sizes
        run: |
          set -eux

          echo "Total rootfs:"
          du -sh build/rootfs

          echo
          echo "Python:"
          du -sh \
            build/rootfs/usr/local/lib/python3.14

          echo
          echo "Home Assistant:"
          du -sh \
            build/rootfs/usr/local/lib/python3.14/site-packages/homeassistant

      # ============================================================
      # CREATE UXC ARCHIVE
      # ============================================================

      - name: Create UXC bundle
        run: |
          set -eux

          mkdir -p release

          VERSION="${{ steps.versions.outputs.homeassistant }}"

          tar \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf \
            "release/homeassistant-uxc-arm64-${VERSION}.tar.gz" \
            -C build \
            rootfs \
            config.json \
            README.txt

      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256
        run: |
          set -eux

          cd release

          sha256sum \
            homeassistant-uxc-arm64-*.tar.gz \
            > SHA256SUMS

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload UXC bundle
        uses: actions/upload-artifact@v4
        with:
          name: homeassistant-uxc-arm64-${{ steps.versions.outputs.homeassistant }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error

      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS